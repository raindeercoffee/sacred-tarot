# 叫醒機器人:Supabase 免費版一個禮拜沒人來就會自動暫停。
# 這個機器人每週一、四去花園資料庫敲一次門,讓它一直醒著。
# 呼吸花園 11/19 搬到自己的倉庫 raindeercoffee/breathing-garden;機器人留在這裡,因為這個倉庫常有更新,GitHub 才不會把它停掉。
# 下面是資料庫網址和「公開」金鑰(本來就寫在網頁裡給瀏覽器用,不是秘密)。換資料庫改這兩行。
# 敲門失敗時這次執行會變紅色,GitHub 會寄信通知。
name: 叫醒花園資料庫

on:
  schedule:
    - cron: '17 3 * * 1,4'   # 台灣時間週一、週四中午 11:17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 去花園資料庫敲門
        env:
          URL: https://ogptfpvgbviedtnvgbkb.supabase.co
          KEY: sb_publishable_5d8cX0eOgFs03rjTykKUZg_HWcBCrCo
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "沒有設定資料庫網址或金鑰"; exit 1
          fi
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
              "$URL/rest/v1/plots?select=slot&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || echo 000)
            echo "第 $i 次敲門,回應碼 $CODE"
            if [ "$CODE" = "200" ]; then echo "資料庫醒著 ✅"; exit 0; fi
            sleep 20
          done
          cat /tmp/body.txt || true
          echo "資料庫沒回應,可能已經睡著了,要去 Supabase 後台叫醒"
          exit 1
